<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!-- El canal único hacia LM Studio es IPC (window.customAPI), que no pasa
         por la CSP. No se abre connect-src hacia el host de LM Studio: el
         renderer no tiene salida de red directa hacia él (hallazgo F1) y una
         apertura permitiría evadir la validación SSRF del proceso Main (F5). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
